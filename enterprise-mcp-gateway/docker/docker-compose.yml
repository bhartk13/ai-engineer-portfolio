version: "3.9"

# Full local stack for the Enterprise MCP Gateway: the gateway itself plus
# every backing service it depends on. Bring it up with:
#   docker compose -f docker/docker-compose.yml up --build
#
# Then obtain a local dev JWT (see docs/security.md) and call, e.g.:
#   curl -X POST localhost:8080/mcp -H "Authorization: Bearer <token>" \
#        -H "Content-Type: application/json" \
#        -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mcp_gateway
      POSTGRES_USER: mcp_gateway
      POSTGRES_PASSWORD: changeme
    ports:
      # Host port 5433 avoids clashing with a local PostgreSQL on 5432.
      # Inside the compose network the gateway still uses postgres:5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mcp_gateway
      DB_USERNAME: mcp_gateway
      DB_PASSWORD: changeme
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Dev-only HMAC secret so the stack is usable without standing up a real IdP.
      # Never set this in a real environment — use MCP_JWK_SET_URI instead.
      MCP_LOCAL_HMAC_SECRET: "local-dev-secret-change-me-please-32-bytes-min"
      DB_CONNECTOR_ALLOWED_TABLES: employees,departments

volumes:
  pgdata:
  grafana-data:
