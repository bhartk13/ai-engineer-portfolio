spring:
  datasource:
    url: jdbc:h2:mem:mcp_gateway;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6399   # deliberately non-default; cache misses degrade to live execution in unit tests
  kafka:
    bootstrap-servers: localhost:0

mcp:
  gateway:
    security:
      local-hmac-secret: test-only-secret-key-not-for-production-use-1234567890
    connectors:
      github:
        enabled: true
        base-url: http://localhost:0
        token: test-token
      database:
        enabled: true
        allowed-tables: employees,departments
